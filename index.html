 async mutate(path,payload,localAction){if(CONFIG.mode==='api'){await this.request(path,{method:'POST',body:JSON.stringify(payload)});await this.load();return}const backup=JSON.stringify(db);try{localAction();localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){db=JSON.parse(backup);throw e}},
 async logout(){if(CONFIG.mode==='api')await this.request('/auth/logout',{method:'POST'});sessionStorage.removeItem(SESSION_KEY);sessionId=null;}
};
function me(){return db?.members.find(m=>m.id===sessionId&&m.active)}
function can(permission){return !!PERMISSIONS[me()?.role]?.[permission]}
function member(id){return db.members.find(x=>x.id===id)}
function asset(id){return db.assets.find(x=>x.id===id)}
function activeLoan(id){return db.loans.find(l=>['使用中','待确认归还'].includes(l.status)&&l.assetIds.includes(id))}
function assetStatus(a){return activeLoan(a.id)?'使用中':a.status}
function memberStatus(m){return db.leaves.some(l=>l.memberId===m.id&&l.status==='已通过'&&Date.parse(l.start)<=Date.now()&&Date.parse(l.end)>=Date.now())?'请假':m.baseStatus}
function overdue(l){return ['使用中','待确认归还'].includes(l.status)&&Date.parse(l.due)<Date.now()}
function badge(s){const colors={'空闲':'green','使用中':'blue','忙碌':'blue','请假':'orange','离线':'','维修中':'orange','已报废':'','待审批':'orange','已通过':'green','待发放':'purple','待确认归还':'purple','已归还':'green','已拒绝':'red','已撤销':'','逾期':'red','已完成':'green','已停用':''};return `<span class="badge ${colors[s]||''}">${esc(s)}</span>`}
function avatar(m){return `<span class="avatar a${Math.max(0,db.members.indexOf(m))%5}">${esc(m?.name?.slice(-2)||'未知')}</span>`}
function assetIcon(a){return `<span class="hardware-icon ${a.category==='通信模块'?'comm':a.category==='传感器'?'sensor':''}">${icon(a.category==='通信模块'?'wifi':a.category==='调试工具'?'tool':'chip')}</span>`}
function btn(text,action,cls='',extra=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`}
function empty(title='暂无记录',description='调整筛选条件，或新增一条记录。'){return `<div class="empty">${icon('box')}<strong>${title}</strong>${description}</div>`}
function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;document.querySelector('#toasts').append(el);setTimeout(()=>el.remove(),4000)}
function audit(text,memberId=me().id){db.logs.push({id:uid('LOG'),actor:me().name,text,memberId,at:new Date().toISOString()})}
function uid(prefix){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`}
function go(next){if(!NAV.some(n=>n[0]===next))return;view=next;history.replaceState(null,'','#'+next);search='';filter='';groupFilter='';page=1;render();window.scrollTo(0,0)}
function pendingCount(){return db.loans.filter(l=>canReview(l)&&['待审批','待发放','待确认归还'].includes(l.status)).length+db.leaves.filter(l=>l.status==='待审批'&&canReview(l)).length}
function canReview(r){const user=me(),owner=member(r.memberId);return !!user&&can('approve')&&user.id!==r.memberId&&(user.role==='teacher'||owner?.role==='member')}
function loginPage(){return `<div class="login"><section class="login-art"><div class="brand"><div class="brandmark">${icon('chip')}</div><div><strong>芯栈 <span style="font-weight:400">Lab</span></strong><small>EMBEDDED SYSTEMS LAB</small></div></div><div class="login-copy"><div class="eyebrow">让每一次探索，有序发生</div><h1>专注创造，<br>让实验室井然有序。</h1><p>连接实验室的每一位成员、每一件设备。<br>从灵感到实践，让协作更进一步。</p></div><div class="circuit"><div class="chip">${icon('chip')}</div><div class="floating-tag one"><span class="dot"></span> &nbsp;成员协同 · 实时状态</div><div class="floating-tag two">${icon('box')} &nbsp;硬件资产 · 有迹可循</div></div><div class="login-art-footer">芯栈 LAB &nbsp; / &nbsp; 嵌入式实验室管理系统</div></section><section class="login-form-wrap"><form class="login-form" id="login-form"><div class="eyebrow">WELCOME BACK</div><h1>欢迎回到实验室</h1><p>登录你的账号，开始今天的探索。</p><div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" placeholder="请输入账号" required value="${CONFIG.mode==='mock'?'teacher':''}"></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required value="${CONFIG.mode==='mock'?'Lab@123456':''}"></div><div class="row between small muted" style="margin-bottom:20px"><span>${icon('shield')} &nbsp;实验室统一工作台</span><span>${CONFIG.mode==='mock'?'本地演示版':'云端登录'}</span></div><button class="btn primary" type="submit">登录工作台 ${icon('arrow')}</button><div class="form-error" id="login-error" role="alert"></div>${CONFIG.mode==='mock'?`<div class="test-accounts"><p>选择测试身份，自动填入账号</p><div class="account-buttons"><button type="button" data-action="fill-account" data-value="teacher">指导老师</button><button type="button" data-action="fill-account" data-value="manager">负责人</button><button type="button" data-action="fill-account" data-value="member">普通成员</button></div><small>初始测试账号密码：<span class="mono">Lab@123456</span></small></div><p class="login-caption">当前为前端演示，数据仅保存在 " title="退出登录">${icon('logout')}</button></div></header><div class="content" id="content">${renderView()}</div></main>`}
function heading(title,subtitle,buttons='',eyebrow=''){return `<div class="page-heading"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1><p>${subtitle}</p></div><div class="controls-wrap">${buttons}</div></div>`}
function statsCard(title,value,unit,ico,color,foot){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon ${color}">${icon(ico)}</span></div><div class="stat-value">${value}<small>${unit}</small></div><div class="stat-foot">${foot}</div></div>`}

function dashboard(){const people=db.members.filter(m=>m.active),available=db.assets.filter(a=>assetStatus(a)==='空闲').length,using=db.assets.filter(a=>assetStatus(a)==='使用中').length,repair=db.assets.filter(a=>assetStatus(a)==='维修中').length,retired=db.assets.filter(a=>assetStatus(a)==='已报废').length,total=db.assets.length,free=people.filter(m=>memberStatus(m)==='空闲').length,busy=people.filter(m=>memberStatus(m)==='忙碌').length,leave=people.filter(m=>memberStatus(m)==='请假').length,offline=people.filter(m=>memberStatus(m)==='离线').length,late=db.loans.filter(overdue).length;const usage=Math.round(using/(total-retired||1)*100);const today=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const active=db.loans.filter(l=>['使用中','待确认归还'].includes(l.status));return `${heading(`你好，${esc(me().name)} <span style="font-size:22px">☀️</span>`,`今天是 ${today}，一起让实验室高效运转。`,btn(`${icon('calendar')} 申请请假`,'leave-new')+btn(`${icon('plus')} 借用模块`,'loan-new','primary'),'LAB OVERVIEW / 实验室概览')}<div class="stats">${statsCard('实验室成员',people.length,'人','users','',`<span class="mini-tag">${free} 人空闲</span><span>${busy} 忙碌 · ${leave} 请假 · ${offline} 离线</span>`)}${statsCard('硬件模块',total,'件','chip','purple',`<span>${new Set(db.assets.map(a=>a.category)).size} 个分类</span><span>·</span><span>${new Set(db.assets.map(a=>a.model)).size} 种型号</span>`)}${statsCard('可用模块',available,'件','box','green',`<span class="mini-tag">随时可借用</span><span>${using} 件使用中</span>`)}${statsCard('待处理事项',can('approve')?pendingCount():db.loans.filter(l=>l.memberId===me().id&&l.status==='待审批').length,'项','clock','orange',`<span style="color:${late?'#cf8a43':'#8992a4'}">${late} 笔借用已逾期</span><span>·</span><span>${repair} 件维修中</span>`)}</div><div class="grid-main"><div><section class="panel"><div class="panel-head"><h2>成员状态 <span>${people.length} 位成员</span></h2><div class="legend"><span><i style="background:#26a078"></i>空闲</span><span><i style="background:#547ce2"></i>忙碌</span><span><i style="background:#d29740"></i>请假</span></div></div><div class="member-grid">${people.slice(0,6).map(memberCard).join('')}</div><div class="panel-foot"><span><span class="dot" style="width:4px;height:4px"></span> &nbsp;状态根据当前记录计算 · 在线情况为模拟</span><button class="text-btn" data-action="nav" data-view="members">查看全部成员 ${icon('arrow')}</button></div></section><section class="panel"><div class="panel-head"><div><h2>正在使用的模块</h2><p>追踪设备去向，让每一件硬件都有记录</p></div><button class="text-btn" data-action="nav" data-view="loans">全部记录 ${icon('chevron')}</button></div><div class="table-wrap"><table><thead><tr><th>模块 / 型号</th><th>使用者</th><th>预计归还</th><th>状态</th></tr></thead><tbody>${active.flatMap(l=>l.assetIds.map(id=>{const a=asset(id);return `<tr><td><button class="row" style="text-align:left;padding:0" data-action="asset-detail" data-id="${a.id}">${assetIcon(a)}<span><strong>${esc(a.name)}</strong><small class="mono">${esc(a.id)}</small></span></button></td><td>${esc(member(l.memberId)?.name)}</td><td style="color:${overdue(l)?'#d28370':'inherit'}">${fmt(l.due)}</td><td>${badge(overdue(l)?'逾期':l.status)}</td></tr>`})).slice(0,5).join('')}</tbody></table>${!active.length?empty('暂无借出模块','当前所有可用设备均已归还。'):''}</div></section></div><div class="grid-side"><section class="panel"><div class="panel-head"><h2>模块使用概况</h2><span class="small muted">共 ${total} 件</span></div><div class="utilization"><div class="donut" style="background:conic-gradient(#6487ec 0 ${using/total*100}%,#69bba3 ${using/total*100}% ${(using+available)/total*100}%,#e8bf79 ${(using+available)/total*100}% ${(using+available+repair)/total*100}%,#e7ebf3 0)"><div class="donut-label"><strong>${usage}<span style="display:inline;font-size:17px;color:#324057">%</span></strong><span>在册资产使用率</span></div></div><div class="chart-legend">${[['使用中',using,'#6487ec'],['空闲',available,'#69bba3'],['维修中',repair,'#e8bf79'],['已报废',retired,'#dfe5ef']].map(([s,n,c])=>`<div><i style="background:${c}"></i>${s}<b>${n}</b></div>`).join('')}</div></div><div class="usage-bottom"><span>设备可借用率（含全部资产）</span><strong>${Math.round(available/total*100)}% 可借用 ${icon('check')}</strong></div></section><section class="panel"><div class="panel-head"><h2>${can('approve')?'待办提醒':'我的提醒'} <span>${todoItems().length}</span></h2><button class="text-btn" data-action="notifications">查看全部</button></div><div class="todo-list">${todoItems().slice(0,3).map(t=>`<div class="todo"><span class="todo-icon ${t.orange?'orange':''}">${icon(t.icon)}</span><div><strong>${esc(t.title)}</strong><small>${esc(t.description)}</small></div><button class="arrow" data-action="nav" data-view="${t.view}" aria-label="查看${esc(t.title)}">${icon('chevron')}</button></div>`).join('')||empty('暂无待办','可以专注于你的实验了。')}</div></section><section class="panel"><div class="panel-head"><h2>最近动态</h2><span class="small muted">实验室足迹</span></div><div class="activity">${visibleLogs().slice(0,3).map(l=>`<div class="activity-item">${esc(l.actor)} · ${esc(l.text)}<small>${fmt(l.at,true)}</small></div>`).join('')||'<span class="small muted">暂无动态</span>'}</div></section></div></div>${competitionOverview()}<footer class="page-footer"><span>© 2026 芯栈 Lab · 嵌入式创新实验室</span><span><span class="dot"></span>本地演示数据 &nbsp; / &nbsp; 最后刷新 ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></footer>`}
function visibleLogs(){return db.logs.filter(l=>me().role!=='member'||l.memberId===me().id||!l.private).sort((a,b)=>Date.parse(b.at)-Date.parse(a.at))}
function todoItems(){const tasks=[];for(const l of db.loans){if(canReview(l)&&['待审批','待发放','待确认归还'].includes(l.status))tasks.push({title:`${member(l.memberId)?.name} · ${l.status==='待审批'?'模块借用申请':l.status}`,description:l.assetIds.map(id=>asset(id)?.name).join('、'),icon:'swap',view:'loans'});if(overdue(l)&&(can('approve')||l.memberId===me().id))tasks.push({title:'模块借用已逾期',description:`${member(l.memberId)?.name} · ${fmt(l.due)} 应归还`,icon:'clock',view:'loans',orange:true})}for(const l of db.leaves)if(l.status==='待审批'&&canReview(l))tasks.push({title:`${member(l.memberId)?.name} · 请假申请`,description:`${fmt(l.start)} — ${fmt(l.end)}`,icon:'calendar',view:'leaves',orange:true});return tasks}
function renderView(){return view==='dashboard'?dashboard():typeof pages!=='undefined'&&pages[view]?pages[view]():empty('页面加载中','正在完善实验室管理功能。')}

function toolbar(placeholder,statuses,groups=[]){return `<div class="toolbar"><div class="search-field">${icon('search')}<input aria-label="搜索" id="search" placeholder="${placeholder}" value="${esc(search)}"></div><select aria-label="状态筛选" id="filter">${options(statuses,filter,'全部状态')}</select>${groups.length?`<select aria-label="分类筛选" id="group-filter">${options(groups,groupFilter,'全部分类')}</select>`:''}<button class="text-btn" data-action="clear-filter">重置筛选</button></div>`}
function paginate(items){const count=Math.max(1,Math.ceil(items.length/PAGE_SIZE));page=Math.min(page,count);return {rows:items.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),footer:`<div class="pagination"><span>共 ${items.length} 条记录 · 第 ${page} / ${count} 页</span><div class="row" style="gap:6px">${btn('上一页','page','small',`data-value="${page-1}" ${page===1?'disabled':''}`)}<button class="current" disabled>${page}</button>${btn('下一页','page','small',`data-value="${page+1}" ${page===count?'disabled':''}`)}</div></div>`}}

// 仅用于本地演示的密码校验器。生产环境必须由服务器验证密码和权限。
// 自定义密码只保存随机盐与 PBKDF2 校验结果，不保存明文，不写入成员公开资料或日志。
const PASSWORD_ITERATIONS = 150000;
function validatePassword(password, confirmation=password) {
  requirePermission(typeof password==='string'&&password.length>=8&&password.length<=64,'密码需要 8–64 个字符');
  requirePermission(/[A-Za-z]/.test(password)&&/[0-9]/.test(password),'密码至少包含一个英文字母和一个数字');
  requirePermission(password===confirmation,'两次输入的密码不一致');
}
const bytesToHex = bytes => Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
function hexToBytes(text) {
  requirePermission(typeof text==='string'&&/^(?:[a-f0-9]{2})+$/i.test(text),'账号密码记录无效，请联系管理员');
  return Uint8Array.from(text.match(/.{2}/g),part=>parseInt(part,16));
}
async function passwordDigest(password,salt,iterations) {
  requirePermission(globalThis.crypto?.subtle,'当前浏览器无法创建密码，请使用本地预览地址或 HTTPS 打开');
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,256);
  return bytesToHex(new Uint8Array(bits));
}
async function makeCredential(password) {
  validatePassword(password);
  requirePermission(globalThis.crypto?.getRandomValues,'当前浏览器不支持密码初始化，请使用本地预览地址');
  const salt=crypto.getRandomValues(new Uint8Array(16));
  return {algorithm:'PBKDF2-SHA256',iterations:PASSWORD_ITERATIONS,salt:bytesToHex(salt),digest:await passwordDigest(password,salt,PASSWORD_ITERATIONS)};
}
async function verifyCredential(password,credential) {
  if(!credential||credential.algorithm!=='PBKDF2-SHA256'||!Number.isInteger(credential.iterations)||credential.iterations<10000||credential.iterations>1000000)return false;
  if(typeof password!=='string'||password.length>64)return false;
  const actual=await passwordDigest(password,hexToBytes(credential.salt),credential.iterations);
  if(typeof credential.digest!=='string'||actual.length!==credential.digest.length)return false;
  let mismatch=0;
  for(let i=0;i<actual.length;i++)mismatch|=actual.charCodeAt(i)^credential.digest.charCodeAt(i);
  return mismatch===0;
}
function cleanMemberData(input,self=false) {
  const keys=self?['name','direction','contact']:['name','number','username','role','group','direction','contact'];
  return Object.fromEntries(keys.map(key=>[key,String(input[key]??'').trim()]));
}
function validateMemberData(data,id=null,self=false) {
  requirePermission(data.name&&data.name.length<=30,'姓名不能为空，且不能超过 30 个字符');
  if(self)return;
  requirePermission(data.number&&data.number.length<=30&&data.group&&data.group.length<=40,'请填写有效的学号 / 工号和所属小组');
  requirePermission(/^[A-Za-z0-9_]{3,30}$/.test(data.username),'账号须为 3–30 位字母、数字或下划线');
  requirePermission(Object.hasOwn(ROLE,data.role),'请选择有效角色');
  requirePermission(me()?.role==='teacher'||data.role==='member','负责人只能为普通成员创建或维护账号');
  requirePermission(!db.members.some(m=>m.id!==id&&m.number===data.number),'该学号 / 工号已存在');
  requirePermission(!db.members.some(m=>m.id!==id&&m.username.toLowerCase()===data.username.toLowerCase()),'该登录账号已存在，请换一个账号');
}
async function createMemberAccount(input,password,confirmation=password) {
  requirePermission(can('manageMembers'));
  const data=cleanMemberData(input);
  validateMemberData(data);
  validatePassword(password,confirmation);
  const actorId=me().id;
  const credential=CONFIG.mode==='mock'?await makeCredential(password):null;
  // 校验在异步密码派生后再做一次，防止同一标签页状态变化。
  requirePermission(me()?.id===actorId&&can('manageMembers'),'当前身份已变化，请重新提交');
  validateMemberData(data);
  let created=null;
  await API.mutate('/members',{...data,password},()=>{
    const now=new Date().toISOString();
    created={...data,id:uid('m'),active:true,baseStatus:'空闲',joined:now,updated:now,note:''};
    db.members.push(created);
    db.credentials??={};
    db.credentials[created.id]=credential;
    audit(`创建成员账号 ${data.name}（${data.username}）`,created.id);
  });
  return created||db.members.find(m=>m.username===data.username);
}

// 中文输入法合成期间不重绘输入框；确认输入后再刷新结果。
let searchComposing=false,searchTimer=null;
function applySearch(input){if(!input||input.id!=='search')return;search=input.value;const position=input.selectionStart;page=1;const content=document.querySelector('#content');if(!content)return;content.innerHTML=renderView();const replacement=document.querySelector('#search');if(replacement){replacement.focus();replacement.setSelectionRange(position,position)}}
document.addEventListener('compositionstart',e=>{if(e.target.id==='search'){searchComposing=true;clearTimeout(searchTimer)}});
document.addEventListener('compositionend',e=>{if(e.target.id==='search'){searchComposing=false;clearTimeout(searchTimer);applySearch(e.target)}});
document.addEventListener('input',e=>{if(e.target.id!=='search'||e.isComposing||searchComposing)return;clearTimeout(searchTimer);const input=e.target;searchTimer=setTimeout(()=>{if(input.isConnected)applySearch(input)},180)});

function setMobileMenu(open){document.querySelector('.sidebar')?.classList.toggle('open',open);document.querySelector('.overlay')?.classList.toggle('open',open);syncNavigationAccessibility();if(open)document.querySelector('.nav button.active')?.focus();else document.querySelector('[data-action="menu"]')?.focus()}

function competitionStatus(c){const now=Date.now();if(c.archived)return '已归档';if(now>Date.parse(c.end))return '已结束';if(now>=Date.parse(c.start))return '进行中';if(now>=Date.parse(c.registrationStart)&&now<=Date.parse(c.registrationEnd))return '报名中';if(now<Date.parse(c.registrationStart))return '未开放';return '准备中'}
function competitionBadge(c){const status=competitionStatus(c);return `<span class="badge ${{'报名中':'green','进行中':'blue','准备中':'orange','未开放':'purple'}[status]||''}">${status}</span>`}
function fullDate(v){return new Date(v).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function competitionById(id){const c=db.competitions.find(c=>c.id===id);requirePermission(c,'比赛记录不存在');return c}
function upcomingCompetitions(){return db.competitions.filter(c=>!c.archived&&Date.parse(c.end)>=Date.now()).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start))}
function competitionOverview(){const upcoming=upcomingCompetitions();return `<section class="panel"><div class="panel-head"><div><h2>${icon('trophy')} 近期比赛 <span>${upcoming.length} 场</span></h2><p>关注赛程与报名截止时间，提前安排项目进度</p></div><button class="text-btn" data-action="nav" data-view="competitions">全部比赛 ${icon('chevron')}</button></div><div class="competition-overview">${upcoming.slice(0,3).map(c=>`<button class="competition-brief" data-action="competition-detail" data-id="${esc(c.id)}"><span class="contest-date"><b>${new Date(c.start).getDate()}</b><small>${new Date(c.start).getMonth()+1} 月</small></span><span class="stack" style="text-align:left;flex:1;min-width:0"><strong>${esc(c.name)}</strong><small class="muted">${fmt(c.start)} 开赛 · ${fmt(c.registrationEnd)} 报名截止</small></span>${competitionBadge(c)}</button>`).join('')||empty('暂无近期比赛','管理人员可在比赛管理中录入赛事。')}</div></section>`}
function competitionsPage(){const all=db.competitions,list=all.filter(c=>matches(c.name,c.organizer,c.location,member(c.ownerId)?.name)&&(!filter||competitionStatus(c)===filter)&&(!groupFilter||c.level===groupFilter)).sort((a,b)=>Number(a.archived)-Number(b.archived)||Date.parse(a.start)-Date.parse(b.start)),p=paginate(list);const current=all.filter(c=>!c.archived),open=current.filter(c=>competitionStatus(c)==='报名中').length,soon=current.filter(c=>Date.parse(c.start)>=Date.now()&&Date.parse(c.start)<=Date.now()+7*86400000).length;return `${heading('比赛管理','从报名到答辩，集中掌握赛程、流程与参赛要求。',can('manageCompetitions')?btn(`${icon('plus')} 新增比赛`,'competition-new','primary'):'','COMPETITIONS / 赛事安排')}<div class="stats">${statsCard('赛事记录',current.length,'场','trophy','',`<span>完整保存比赛安排与须知</span>`)}${statsCard('正在报名',open,'场','file','green','<span>留意截止时间，提前完成组队</span>')}${statsCard('近 7 天开赛',soon,'场','calendar','orange','<span>提前准备设备与参赛材料</span>')}${statsCard('进行中的比赛',current.filter(c=>competitionStatus(c)==='进行中').length,'场','clock','purple','<span>按流程节点推进比赛</span>')}</div><div class="notice">页面内初始赛事均为演示案例，时间相对当前日期生成。正式比赛请以主办方最新通知为准。</div><section class="panel">${toolbar('搜索比赛名称、主办方、地点、负责人…',['未开放','报名中','准备中','进行中','已结束','已归档'],['实验室','校级','省级','国家级','国际级'])}<div class="competition-cards">${p.rows.map(c=>{const next=c.stages.filter(s=>Date.parse(s.at)>=Date.now()).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at))[0];return `<article class="contest-card"><div class="row between"><span class="contest-category">${icon('trophy')} ${esc(c.level)} · ${esc(c.category)}</span>${competitionBadge(c)}</div><h2>${esc(c.name)}</h2><p class="contest-summary">${esc(c.summary||'查看比赛详情，了解完整安排。')}</p><div class="contest-meta"><div>${icon('calendar')}<span>比赛时间<strong>${fullDate(c.start)} — ${fmt(c.end,true)}</strong></span></div><div>${icon('clock')}<span>报名截止<strong>${fullDate(c.registrationEnd)}</strong></span></div><div>${icon('users')}<span>比赛负责人<strong>${esc(member(c.ownerId)?.name||'待指定')} · ${esc(c.teamSize||'不限')}</strong></span></div></div><div class="contest-next"><span class="dot" style="background:${next?'#6487ec':'#adb6c5'}"></span><span>${next?`下一节点：${esc(next.title)} · ${fmt(next.at,true)}`:'所有计划节点时间已到'}</span></div><div class="row between"><span class="small muted">${esc(c.location)}</span><div style="flex-shrink:0"><button class="text-btn" data-action="competition-detail" data-id="${esc(c.id)}">查看赛程 ${icon('chevron')}</button>${can('manageCompetitions')?`<button class="text-btn" data-action="competition-edit" data-id="${esc(c.id)}">编辑</button>`:''}</div></div></article>`}).join('')||empty('暂无匹配的比赛','调整筛选条件，或新增比赛记录。')}</div>${p.footer}</section>`}
function competitionDetail(id){const c=competitionById(id),stages=[...c.stages].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));modal('比赛详情',`<div class="row between" style="margin-bottom:12px"><span class="contest-category">${icon('trophy')} ${esc(c.level)} · ${esc(c.category)}</span>${competitionBadge(c)}</div><h1 style="font-size:23px;line-height:1.5">${esc(c.name)}</h1><p class="small muted" style="line-height:1.9;margin-top:10px">${esc(c.summary)}</p>${details([['主办方',c.organizer],['负责人',member(c.ownerId)?.name||'待指定'],['报名开始',fullDate(c.registrationStart)],['报名截止',fullDate(c.registrationEnd)],['比赛开始',fullDate(c.start)],['比赛结束',fullDate(c.end)],['比赛地点',c.location],['组队要求',c.teamSize||'不限']])}${c.link&&/^https?:\/\//i.test(c.link)?`<p style="margin-bottom:20px"><a href="${esc(c.link)}" target="_blank" rel="noopener noreferrer">官方通知 / 比赛官网 ↗</a></p>`:''}<h2 style="margin:24px 0 18px">比赛流程</h2><div class="contest-timeline">${stages.map((s,i)=>`<div class="stage-item ${Date.parse(s.at)<Date.now()?'past':''}"><span class="stage-number">${i+1}</span><div><div class="row between" style="gap:8px"><strong>${esc(s.title)}</strong><small>${Date.parse(s.at)<Date.now()?'计划时间已到':'待进行'}</small></div><time>${fullDate(s.at)}</time><p>${esc(s.description)}</p></div></div>`).join('')}</div><h2 style="margin:23px 0 14px">参赛须知</h2><div class="contest-requirements">${esc(c.requirements||'暂无补充须知。').replace(/\n/g,'<br>')}</div><p class="privacy-note">流程标签只表示计划时间是否已到，不代表实际任务已完成。正式安排以主办方通知为准。</p>`,'',null,can('manageCompetitions')?btn('编辑比赛','competition-edit','primary',`data-id="${esc(id)}"`):'')}
function stageFields(stage={title:'',at:date(7,18),description:''}){return `<div class="stage-form-row"><div class="row between"><strong class="small">流程节点</strong><button class="icon-btn" type="button" data-action="competition-stage-remove" aria-label="移除此流程节点">${icon('close')}</button></div><div class="form-grid"><div class="field"><label>节点名称 *<input name="stageTitle" aria-label="节点名称" value="${esc(stage.title)}" required maxlength="50" placeholder="例如：作品提交"></label></div><div class="field"><label>节点时间 *<input type="datetime-local" aria-label="节点时间" name="stageDate" required value="${inputDate(stage.at)}"></label></div><div class="field full"><label>节点说明<input name="stageDescription" aria-label="节点说明" value="${esc(stage.description)}" maxlength="200" placeholder="该阶段需要准备或完成的事项"></label></div></div></div>`}
function competitionForm(id){requirePermission(can('manageCompetitions'));const c=id?competitionById(id):null;modal(c?'编辑比赛':'新增比赛',`<div class="form-grid">${field('比赛名称 *','name',c?.name||'','text','required maxlength="80"')}${field('主办方 *','organizer',c?.organizer||'','text','required maxlength="80"')}${selectField('比赛级别','level',['实验室','校级','省级','国家级','国际级'],c?.level||'校级')}${field('比赛方向','category',c?.category||'嵌入式设计','text','maxlength="40"')}${field('报名开始 *','registrationStart',inputDate(c?.registrationStart||date(0,9)),'datetime-local','required')}${field('报名截止 *','registrationEnd',inputDate(c?.registrationEnd||date(7,18)),'datetime-local','required')}${field('比赛开始 *','start',inputDate(c?.start||date(14,9)),'datetime-local','required')}${field('比赛结束 *','end',inputDate(c?.end||date(14,18)),'datetime-local','required')}${field('比赛地点 *','location',c?.location||'','text','required maxlength="100"')}${selectField('比赛负责人','ownerId',db.members.filter(m=>m.active||m.id===c?.ownerId).map(m=>[m.id,m.name]),c?.ownerId||me().id)}${field('组队要求','teamSize',c?.teamSize||'','text','maxlength="60" placeholder="例如：2–4 人 / 队"')}${field('官方通知链接','link',c?.link||'','url','placeholder="https://…"')}${area('比赛简介','summary',c?.summary||'','maxlength="400"')}${area('参赛须知 *','requirements',c?.requirements||'','required maxlength="4000" placeholder="填写参赛资格、材料清单、评分规则和现场注意事项，可换行分条。"')}</div><div class="row between" style="margin:24px 0 12px"><h3>比赛流程 *</h3>${btn(`${icon('plus')} 添加节点`,'competition-stage-add','small')}</div><div id="stage-fields">${(c?.stages||[{title:'报名截止',at:date(7,18),description:'完成组队并提交报名信息。'},{title:'正式比赛',at:date(14,9),description:'按主办方要求参加比赛。'}]).map(stageFields).join('')}</div><p class="privacy-note">可添加报名、初赛、提交作品、决赛、答辩、结果公布等节点，保存后按时间自动排序。</p>`,'保存比赛',async f=>{const data=Object.fromEntries([...f].filter(([k])=>!k.startsWith('stage')));Object.keys(data).forEach(k=>data[k]=data[k].trim());for(const key of ['name','organizer','location','requirements'])requirePermission(data[key],'请填写比赛名称、主办方、地点和参赛须知');for(const key of ['registrationStart','registrationEnd','start','end'])data[key]=new Date(data[key]).toISOString();requirePermission(Date.parse(data.registrationEnd)>Date.parse(data.registrationStart),'报名截止时间必须晚于报名开始');requirePermission(Date.parse(data.start)>=Date.parse(data.registrationEnd),'比赛开始时间不能早于报名截止');requirePermission(Date.parse(data.end)>Date.parse(data.start),'比赛结束时间必须晚于比赛开始');requirePermission(!data.link||/^https?:\/\//i.test(data.link),'官方通知链接只支持 http 或 https');requirePermission(member(data.ownerId),'请选择有效负责人');const titles=f.getAll('stageTitle'),dates=f.getAll('stageDate'),descriptions=f.getAll('stageDescription');requirePermission(titles.length>=1&&titles.length<=20,'请保留 1–20 个流程节点');data.stages=titles.map((title,i)=>{requirePermission(title.trim(),'流程节点名称不能为空');return {title:title.trim(),at:new Date(dates[i]).toISOString(),description:descriptions[i].trim()}}).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at));await save(c?`/competitions/${id}/update`:'/competitions',data,()=>{if(c)Object.assign(c,data,{updated:new Date().toISOString()});else db.competitions.push({...data,id:uid('COMP'),archived:false,created:new Date().toISOString()});audit(`${c?'更新':'新增'}比赛 ${data.name}`)},'比赛安排已保存')},c?btn(c.archived?'恢复展示':'归档比赛','competition-archive',c.archived?'':'danger',`data-id="${esc(c.id)}"`):'')}
async function competitionAction(type,b){const id=b.dataset.id;if(type==='competition-new')return competitionForm();if(type==='competition-edit')return competitionForm(id);if(type==='competition-detail')return competitionDetail(id);if(type==='competition-stage-add'){requirePermission(document.querySelectorAll('.stage-form-row').length<20,'最多添加 20 个节点');document.querySelector('#stage-fields').insertAdjacentHTML('beforeend',stageFields());document.querySelector('#stage-fields').lastElementChild.querySelector('input').focus();return}if(type==='competition-stage-remove'){requirePermission(document.querySelectorAll('.stage-form-row').length>1,'请至少保留一个比赛流程节点');b.closest('.stage-form-row').remove();return}if(type==='competition-archive'){requirePermission(can('manageCompetitions'));const c=competitionById(id);return confirmation(c.archived?'恢复比赛展示':'归档比赛',c.archived?'恢复后这场比赛会重新出现在近期比赛与统计中。':'归档后不再出现在近期比赛中，完整赛程与参赛须知仍可按“已归档”筛选查看。',`/competitions/${id}/archive`,{archived:!c.archived},()=>{c.archived=!c.archived;audit(`${c.archived?'归档':'恢复'}比赛 ${c.name}`)})}}

function details(entries){return `<dl class="detail-grid">${entries.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v??'—')}</dd></div>`).join('')}</dl>`}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,values,selected=''){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options(values,selected)}</select></div>`}
function area(label,name,value='',extra=''){return `<div class="field full"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea></div>`}
let modalSubmit=null;

function requirePermission(test,message='当前身份没有此操作权限'){if(!test)throw new Error(message)}
function getLoan(id){const l=db.loans.find(x=>x.id===id);requirePermission(l,'借用记录不存在');requirePermission(me().role!=='member'||l.memberId===me().id);return l}

async function save(path,payload,callback,message='已保存'){await API.mutate(path,payload,callback);document.querySelector('#modal').close();render();toast(message)}
function confirmation(title,description,path,payload,callback,label='确认'){modal(title,`<p style="line-height:1.9;font-size:13px">${esc(description)}</p>`,label,()=>save(path,payload,callback,'操作成功'))}

function transitionLoan(id,operation,data={}){const l=getLoan(id),now=new Date().toISOString();if(operation==='cancel'){requirePermission(l.memberId===me().id);ensureState(l,['待审批']);l.status='已撤销'}else if(operation==='review'){requirePermission(canReview(l));ensureState(l,['待审批']);requirePermission(['approve','reject'].includes(data.decision));requirePermission(data.decision!=='approve'||Date.parse(l.due)>Date.now(),'预计归还时间已过，请拒绝后重新申请');l.status=data.decision==='approve'?'待发放':'已拒绝';l.reviewer=me().id;l.opinion=data.opinion;l.reviewed=now}else if(operation==='issue'){requirePermission(canReview(l));ensureState(l,['待发放']);requirePermission(Date.parse(l.due)>Date.now(),'预计归还时间已过，无法发放');requirePermission(l.assetIds.every(id=>asset(id)&&assetStatus(asset(id))==='空闲'),'模块已被借出、维修或报废，无法重复发放');l.status='使用中';l.issued=now;l.issuer=me().id}else if(operation==='request-return'){requirePermission(l.memberId===me().id);ensureState(l,['使用中']);l.status='待确认归还';l.returnRequested=now}else if(operation==='receive'){requirePermission(canReview(l));ensureState(l,['待确认归还']);requirePermission(Array.isArray(data.damagedIds)&&data.damagedIds.every(id=>l.assetIds.includes(id)));l.status='已归还';l.returned=now;l.receiver=me().id;l.returnNote=data.note;for(const id of l.assetIds){const a=asset(id),broken=data.damagedIds.includes(id);a.status=broken?'维修中':'空闲';if(broken){db.maintenance.push({id:uid('MT'),assetId:id,description:data.note||'归还验收发现损坏',created:now,actor:me().id,status:'维修中'})}}}else throw new Error('无效操作');audit(`${({cancel:'撤销借用申请',review:data.decision==='approve'?'批准借用申请':'拒绝借用申请',issue:'确认发放模块','request-return':'申请归还模块',receive:'验收归还模块'})[operation]} · ${l.assetIds.map(id=>asset(id)?.name).join('、')}`,l.memberId)}
function reviewForm(kind,id){const l=kind==='loan'?getLoan(id):getLeave(id);requirePermission(canReview(l));ensureState(l,['待审批']);modal(kind==='loan'?'审批借用申请':'审批请假申请',`${details([['申请人',member(l.memberId)?.name],[kind==='loan'?'模块':'请假时间',kind==='loan'?l.assetIds.map(id=>asset(id)?.name).join('、'):`${fmt(l.start,true)} — ${fmt(l.end,true)}`],[kind==='loan'?'用途':'原因',kind==='loan'?l.purpose:l.reason]])}<div class="form-grid">${selectField('审批结果','decision',[['approve','通过申请'],['reject','拒绝申请']])}${area('审批意见','opinion','','maxlength="200" placeholder="拒绝申请时请填写原因"')}</div>`,'确认审批',f=>{const data=Object.fromEntries(f);requirePermission(data.decision!=='reject'||data.opinion.trim(),'拒绝申请时请填写审批意见');return save(`/${kind==='loan'?'loans':'leaves'}/${id}/review`,data,()=>kind==='loan'?transitionLoan(id,'review',data):transitionLeave(id,'review',data),'审批已完成')})}
function returnForm(id){const l=getLoan(id);requirePermission(canReview(l));ensureState(l,['待确认归还']);modal('验收归还模块',`<div class="notice">确认收到全部实物后再提交。勾选损坏的模块，将自动转入维修中；未勾选的模块恢复空闲。</div><div class="field"><label>损坏模块（完好无需勾选）</label><div class="asset-picker">${l.assetIds.map(id=>`<label class="asset-option"><input type="checkbox" name="damagedIds" value="${id}"><span>${esc(asset(id).name)}<small>${esc(id)}</small></span></label>`).join('')}</div></div><div style="margin-top:18px">${area('验收备注','note','','maxlength="200" placeholder="存在损坏时请描述问题"')}</div>`,'确认已收到实物',f=>{const data={damagedIds:f.getAll('damagedIds'),note:f.get('note').trim()};requirePermission(!data.damagedIds.length||data.note,'请填写损坏情况');return save(`/loans/${id}/receive`,data,()=>transitionLoan(id,'receive',data),'归还已确认，库存已同步更新')})}
function leaveForm(){modal('申请请假',`<div class="form-grid">${field('开始时间 *','start',inputDate(date(1,9)),'datetime-local','required')}${field('结束时间 *','end',inputDate(date(1,18)),'datetime-local','required')}${area('请假原因 *','reason','','required maxlength="300" placeholder="请简要填写原因，仅本人及审批人可见"')}</div><p class="privacy-note">审批通过后，在请假时段内自动显示为“请假”。公开列表不会显示你的请假原因。</p>`,'提交请假申请',f=>{const data={start:new Date(f.get('start')).toISOString(),end:new Date(f.get('end')).toISOString(),reason:f.get('reason').trim()};requirePermission(data.reason,'请填写请假原因');requirePermission(Date.parse(data.end)>Date.parse(data.start),'结束时间必须晚于开始时间');requirePermission(Date.parse(data.end)>Date.now(),'请假结束时间必须晚于当前时间');requirePermission(!db.leaves.some(l=>l.memberId===me().id&&['待审批','已通过'].includes(l.status)&&Date.parse(l.start)<Date.parse(data.end)&&Date.parse(l.end)>Date.parse(data.start)),'该时段已有待审批或已通过的请假申请');return save('/leaves',data,()=>{db.leaves.push({...data,id:uid('LV'),memberId:me().id,status:'待审批',created:new Date().toISOString()});audit('提交请假申请');db.logs.at(-1).private=true},'请假申请已提交')})}

 if(type==='todo-nav'){document.querySelector('#modal').close();go(b.dataset.view);return}
 if(type==='loan-cancel'){const l=getLoan(id);requirePermission(l.memberId===me().id);ensureState(l,['待审批']);return confirmation('撤销借用申请','撤销后可以重新提交借用申请。',`/loans/${id}/cancel`,{},()=>transitionLoan(id,'cancel'),'确认撤销')}

 if(type==='loan-return'){const l=getLoan(id);requirePermission(l.memberId===me().id);ensureState(l,['使用中']);return confirmation('申请归还','提交后请将实物交给指导老师或负责人验收。验收完成前，模块仍会保留你的使用记录。',`/loans/${id}/request-return`,{},()=>transitionLoan(id,'request-return'),'提交归还申请')}
 if(type==='leave-cancel'){const l=getLeave(id);requirePermission(l.memberId===me().id);ensureState(l,['待审批']);return confirmation('撤销请假申请','确认撤销这条待审批的请假申请？',`/leaves/${id}/cancel`,{},()=>transitionLeave(id,'cancel'),'确认撤销')}
 if(type==='member-toggle'){const m=member(id);requirePermission(editableMember(m)&&m.id!==me().id);if(m.active)requirePermission(!db.loans.some(l=>l.memberId===id&&['使用中','待确认归还','待发放','待审批'].includes(l.status))&&!db.leaves.some(l=>l.memberId===id&&(l.status==='待审批'||l.status==='已通过'&&Date.parse(l.end)>Date.now())),'请先处理该成员的未完成借用与请假记录');return confirmation(m.active?'停用成员':'启用成员',m.active?'停用后该账号无法登录，成员历史记录会保留。':'启用后该成员可以重新登录演示空间。',`/members/${id}/active`,{active:!m.active},()=>{m.active=!m.active;audit(`${m.active?'启用':'停用'}成员 ${m.name}`,id)})}
 if(['asset-repair','asset-repaired','asset-retire'].includes(type)){requirePermission(can('manageAssets'));const a=asset(id);requirePermission(a&&assetStatus(a)!=='使用中'&&assetStatus(a)!=='已报废','请先完成归还，报废资产不能重新操作');if(type==='asset-repair'){requirePermission(a.status==='空闲');modal('登记维修',`${details([['模块',a.name],['编号',a.id]])}${area('故障说明 *','description','','required maxlength="200"')}`,'送入维修',f=>{const description=f.get('description').trim();requirePermission(description,'请填写故障说明');return save(`/assets/${id}/maintenance`,{description},()=>{requirePermission(assetStatus(a)==='空闲','资产已不可用');a.status='维修中';db.maintenance.push({id:uid('MT'),assetId:id,description,created:new Date().toISOString(),actor:me().id,status:'维修中'});audit(`登记维修 ${a.name}`)},'维修记录已保存')});return}const repairDone=type==='asset-repaired';requirePermission(!repairDone||a.status==='维修中');return confirmation(repairDone?'确认维修完成':'报废模块',repairDone?'确认模块功能正常并恢复可借用？':'报废后将无法借用；资产和全部历史记录将永久保留。',`/assets/${id}/${repairDone?'repair-complete':'retire'}`,{},()=>{requirePermission(assetStatus(a)!=='使用中');a.status=repairDone?'空闲':'已报废';db.maintenance.filter(r=>r.assetId===id&&r.status==='维修中').forEach(r=>{r.status=repairDone?'已完成':'已报废';r.completed=new Date().toISOString();r.completer=me().id});audit(`${repairDone?'完成维修':'报废模块'} ${a.name}`)})}
 if(type==='reset'){requirePermission(CONFIG.mode==='mock');modal('恢复演示数据','<p style="font-size:13px;line-height:1.9">这会覆盖当前浏览器中的演示修改，恢复初始成员、模块和借用记录，并退出登录。</p>','确认恢复',async()=>{localStorage.setItem(DB_KEY,JSON.stringify(seed()));sessionStorage.removeItem(SESSION_KEY);sessionId=null;await API.load();document.querySelector('#modal').close();render();toast('已恢复初始演示数据')});return}
 throw new Error('暂不支持此操作');
}
document.addEventListener('submit',async e=>{if(e.target.id!=='modal-form')return;e.preventDefault();if(!modalSubmit)return;const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;const old=submit.textContent;submit.textContent='正在保存…';try{await modalSubmit(new FormData(e.target))}catch(err){document.querySelector('#modal-error').textContent=err.message}finally{submit.disabled=false;submit.textContent=old}});
// 中文搜索与手机导航见 ux.js。
document.addEventListener('change',async e=>{if(['filter','group-filter'].includes(e.target.id)){if(e.target.id==='filter')filter=e.target.value;else groupFilter=e.target.value;page=1;render()}if(e.target.id==='switch-account'){try{requirePermission(CONFIG.mode==='mock');requirePermission(member(e.target.value)?.active);sessionId=e.target.value;sessionStorage.setItem(SESSION_KEY,sessionId);go('dashboard');toast('已切换测试身份')}catch(err){toast(err.message,true)}}});
// 同源标签页同步演示数据。不能替代后端数据库事务或服务端权限检查。
window.addEventListener('storage',async e=>{if(e.key!==DB_KEY)return;try{await API.load();document.querySelector('#modal').close();render();toast('已同步其他标签页的数据')}catch(err){toast(err.message,true)}});
let lastStatusSignature='';
setInterval(()=>{if(!me()||document.querySelector('#modal').open||document.activeElement?.matches('input,select,textarea'))return;const signature=db.members.map(m=>memberStatus(m)).join('|')+db.loans.map(l=>overdue(l)).join('|')+db.competitions.map(c=>competitionStatus(c)).join('|');if(signature!==lastStatusSignature){lastStatusSignature=signature;render()}},30000);
// 支持 WebMCP 的浏览器可读取当前可见库存；不支持时不影响页面功能。
if(document.modelContext?.registerTool){Promise.resolve(document.modelContext.registerTool({name:'list_available_lab_assets',title:'查看可借用模块',description:'读取当前实验室可借用模块，可按名称、型号或资产编号筛选。需要先登录。',inputSchema:{type:'object',properties:{query:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){requirePermission(me(),'请先登录');requirePermission(input&&typeof input==='object'&&Object.keys(input).every(k=>k==='query')&&(input.query===undefined||typeof input.query==='string'),'query 必须是字符串');const q=(input.query||'').toLowerCase();return {assets:db.assets.filter(a=>assetStatus(a)==='空闲'&&`${a.name} ${a.model} ${a.id}`.toLowerCase().includes(q)).map(({id,name,model,location})=>({id,name,model,location}))}}})).catch(()=>{});}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{await action(b.dataset.action,b)}catch(err){toast(err.message,true)}});
document.addEventListener('submit',async e=>{if(e.target.id!=='login-form')return;e.preventDefault();const button=e.target.querySelector('button[type=submit]');button.disabled=true;button.textContent='正在登录…';try{const f=new FormData(e.target);await API.login(f.get('username').trim(),f.get('password'));go('dashboard')}catch(err){document.querySelector('#login-error').textContent=err.message;button.disabled=false;button.innerHTML=`登录工作台 ${icon('arrow')}`}});
async function action(type,b){if(type==='fill-account'){document.querySelector('#username').value=b.dataset.value;document.querySelector('#password').value='Lab@123456';return}if(type==='nav'){go(b.dataset.view);return}if(type==='logout'){await API.logout();render();return}if(type==='menu'){setMobileMenu(true);return}if(type==='close-menu'){setMobileMenu(false);return}if(typeof handleAction==='function')return handleAction(type,b);toast('该功能正在准备中')}
async function init(){try{await API.load();const route=location.hash.slice(1);if(NAV.some(n=>n[0]===route))view=route;render()}catch(e){document.querySelector('#app').innerHTML=`<div class="loading"><h2>暂时无法读取数据</h2><p style="margin:15px">${esc(e.message)}</p>${btn('重试','reload')}${CONFIG.mode==='mock'?btn('恢复演示数据','reset'):''}</div>`}}
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(NAV.some(n=>n[0]===route))go(route)});
init();
</script></body></html>
